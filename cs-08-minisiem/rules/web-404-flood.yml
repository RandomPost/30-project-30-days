id: web-404-flood
title: Directory or file enumeration (404 flood)
description: One address triggers many 404s in a minute, as content discovery does.
severity: medium
tags: [attack.reconnaissance, attack.t1595.003]
detection:
  selection:
    http_status: 404
  condition: selection
  threshold:
    group_by: src_ip
    count: 25
    window: 1m
tests:
  - name: thirty 404s in thirty seconds fire
    source: nginx
    alerts: 1
    lines:
      - '203.0.113.9 - - [18/Oct/2026:12:00:00 +0000] "GET /admin0.php HTTP/1.1" 404 512 "-" "Mozilla/5.0 (X11; Linux x86_64)"'
