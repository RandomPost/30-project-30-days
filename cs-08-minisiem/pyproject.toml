[project]
name = "minisiem"
version = "0.1.0"
description = "Mini SIEM: ingest logs into SQLite, run Sigma-like rules, serve an alert dashboard"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest", "black"]

[project.scripts]
minisiem = "minisiem.cli:main"

[tool.setuptools]
packages = ["minisiem"]
include-package-data = true

[tool.setuptools.package-data]
minisiem = ["static/*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
