[project]
name = "secretscan"
version = "0.1.0"
description = "Scan files for committed secrets; pre-commit and Claude Code hooks included"
requires-python = ">=3.10"

[project.scripts]
secretscan = "secretscan.cli:main"

[tool.setuptools]
packages = ["secretscan"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
