[project]
name = "vulnreport"
version = "0.1.0"
description = "Report known vulnerabilities in lockfile dependencies using OSV.dev"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
vulnreport = "vulnreport.cli:main"

[tool.setuptools]
packages = ["vulnreport"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
