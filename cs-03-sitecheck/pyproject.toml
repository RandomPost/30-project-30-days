[project]
name = "sitecheck"
version = "0.1.0"
description = "Audit TLS and HTTP security headers for sites you own"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
sitecheck = "sitecheck.cli:main"

[tool.setuptools]
packages = ["sitecheck"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
