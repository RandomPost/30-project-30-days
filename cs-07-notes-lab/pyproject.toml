[project]
name = "notes-lab"
version = "0.1.0"
description = "A small Flask notes app used as a break-and-fix security lab"
requires-python = ">=3.10"
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest", "black"]

[tool.setuptools]
packages = ["notes_lab"]
include-package-data = true

[tool.setuptools.package-data]
notes_lab = ["templates/*.html"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
