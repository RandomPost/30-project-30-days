<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Notes{% endblock %}</title>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Notes</a>
    {% if session.get('user_id') %}
    <form method="post" action="{{ url_for('logout') }}" style="display:inline">
      <button type="submit">Log out</button>
    </form>
    {% endif %}
  </nav>
  {% block body %}{% endblock %}
</body>
</html>
