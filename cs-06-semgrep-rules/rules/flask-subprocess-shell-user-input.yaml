rules:
  - id: flask-subprocess-shell-user-input
    languages: [python]
    severity: ERROR
    mode: taint
    message: >-
      Data from the HTTP request reaches a shell command (subprocess with
      shell=True, os.system or os.popen). This allows command injection. Pass an
      argument list without shell=True, and validate the input against an allow-list.
    metadata:
      cwe: "CWE-78: OS Command Injection"
      category: security
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args
          - pattern: flask.request.form
          - pattern: flask.request.values
          - pattern: flask.request.cookies
          - pattern: flask.request.headers
          - pattern: flask.request.json
          - pattern: flask.request.get_json(...)
          - pattern: flask.request.data
          - pattern: flask.request.files
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.cookies
          - pattern: request.headers
          - pattern: request.json
          - pattern: request.get_json(...)
          - pattern: request.data
    pattern-sinks:
      - pattern-either:
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD, ...)
        focus-metavariable: $CMD
