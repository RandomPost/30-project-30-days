rules:
  - id: hardcoded-jwt-secret
    languages: [python]
    severity: ERROR
    message: >-
      Hard-coded secret used to sign or verify JWTs (or stored as a Flask secret
      key). Anyone with the source can forge tokens. Load the secret from the
      environment or a secrets manager, and rotate this one.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      category: security
    pattern-either:
      - pattern: $APP.secret_key = "..."
      - pattern: jwt.encode($PAYLOAD, "...", ...)
      - pattern: jwt.decode($TOKEN, "...", ...)
      - pattern: jwt.encode($PAYLOAD, key="...", ...)
      - pattern: jwt.decode($TOKEN, key="...", ...)
      - patterns:
          - pattern: $APP.config["$KEY"] = "..."
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)(secret|jwt|hmac|signing)
      - patterns:
          - pattern: $APP.config.update(..., $KEYARG="...", ...)
          - metavariable-regex:
              metavariable: $KEYARG
              regex: (?i)(secret|jwt|hmac|signing)
