hostname rogue
frr defaults traditional
service integrated-vtysh-config
!
interface eth1
 ip address 10.99.0.66/24
!
ip route 203.0.113.0/24 blackhole
ip route 198.18.0.0/24 blackhole
ip route 100.64.66.0/24 blackhole
!
ip prefix-list OWN seq 5 permit 203.0.113.0/24
ip prefix-list OWN seq 10 permit 198.18.0.0/24
ip prefix-list OWN seq 15 permit 100.64.66.0/24
!
route-map IN permit 10
!
route-map OUT permit 10
 match ip address prefix-list OWN
!
router bgp 65666
 bgp router-id 10.255.6.1
 no bgp ebgp-requires-policy
 neighbor 10.99.0.254 remote-as 65500
 neighbor 10.99.0.254 description route-server
 neighbor 10.99.0.254 timers 3 9
 neighbor 10.99.0.254 timers connect 5
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 198.18.0.0/24
  network 100.64.66.0/24
  neighbor 10.99.0.254 route-map IN in
  neighbor 10.99.0.254 route-map OUT out
 exit-address-family
exit
!
end
