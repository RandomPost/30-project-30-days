# LAB ONLY: nginx for the purple-team lab target. Combined access log goes to the shared /logs volume.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /logs/nginx-error.log warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type text/html;
    access_log /logs/nginx-access.log combined;
    sendfile on;
    server_tokens off;
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        location = /healthz { access_log off; return 200 "ok"; }  # healthcheck, kept out of the log
        location / { try_files $uri $uri/ =404; }
    }
}
