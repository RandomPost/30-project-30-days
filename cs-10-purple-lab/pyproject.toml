[project]
name = "purplelab"
version = "0.1.0"
description = "Purple-team lab: benign adversary emulation, a SIEM pipeline and an ATT&CK coverage matrix"
requires-python = ">=3.10"
dependencies = ["paramiko>=3", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest", "black"]

[project.scripts]
purplelab = "purplelab.cli:main"

[tool.setuptools]
packages = ["purplelab"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
