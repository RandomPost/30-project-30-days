hostname cust
frr defaults traditional
service integrated-vtysh-config
!
interface eth1
 ip address 10.1.1.2/30
!
interface eth2
 ip address 10.1.2.2/30
!
ip route 203.0.113.0/24 blackhole
ip route 203.0.113.66/32 blackhole
ip route 10.66.0.0/16 blackhole
!
bgp community-list standard RTBH permit 65535:666
!
ip prefix-list CUST-PREFIX seq 5 permit 203.0.113.0/24
ip prefix-list CUST-PREFIX seq 10 permit 10.66.0.0/16
ip prefix-list CUST-RTBH seq 5 permit 203.0.113.66/32
!
! Outbound traffic engineering: prefer ISP1 (local-pref 200) over ISP2 (100).
route-map ISP1-IN permit 10
 set local-preference 200
!
route-map ISP2-IN permit 10
 set local-preference 100
!
! Inbound traffic engineering: announce to ISP2 with the customer AS prepended twice
! so the rest of the world prefers the path through ISP1.
route-map ISP1-OUT permit 5
 match ip address prefix-list CUST-RTBH
 set community 65535:666
route-map ISP1-OUT permit 10
 match ip address prefix-list CUST-PREFIX
!
route-map ISP2-OUT permit 5
 match ip address prefix-list CUST-RTBH
 set community 65535:666
route-map ISP2-OUT permit 10
 match ip address prefix-list CUST-PREFIX
 set community 65002:3 additive
!
router bgp 65100
 bgp router-id 10.255.100.1
 neighbor 10.1.1.1 remote-as 65001
 neighbor 10.1.1.1 description isp1
 neighbor 10.1.1.1 timers 3 9
 neighbor 10.1.1.1 timers connect 5
 neighbor 10.1.2.1 remote-as 65002
 neighbor 10.1.2.1 description isp2
 neighbor 10.1.2.1 timers 3 9
 neighbor 10.1.2.1 timers connect 5
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 203.0.113.66/32
  network 10.66.0.0/16
  neighbor 10.1.1.1 route-map ISP1-IN in
  neighbor 10.1.1.1 route-map ISP1-OUT out
  neighbor 10.1.2.1 route-map ISP2-IN in
  neighbor 10.1.2.1 route-map ISP2-OUT out
 exit-address-family
exit
!
end
