id: ssh-password-spraying
title: SSH password spraying (many users, one source)
description: One address fails logins for many different accounts, the pattern of
  trying a common password across a user list.
severity: high
tags: [attack.credential_access, attack.t1110.003]
detection:
  selection:
    action: [login, invalid_user]
    outcome: failure
  condition: selection
  threshold:
    group_by: src_ip
    distinct: user
    count: 5
    window: 15m
tests:
  - name: six users in ten minutes fire
    source: auth
    alerts: 1
    lines:
      - 'Oct 18 02:00:00 web01 sshd[900]: Failed password for admin from 198.51.100.23 port 51900 ssh2'
      - 'Oct 18 02:02:00 web01 sshd[900]: Failed password for oracle from 198.51.100.23 port 51900 ssh2'
      - 'Oct 18 02:04:00 web01 sshd[900]: Failed password for git from 198.51.100.23 port 51900 ssh2'
      - 'Oct 18 02:06:00 web01 sshd[900]: Failed password for test from 198.51.100.23 port 51900 ssh2'
      - 'Oct 18 02:08:00 web01 sshd[900]: Failed password for ubuntu from 198.51.100.23 port 51900 ssh2'
      - 'Oct 18 02:10:00 web01 sshd[900]: Failed password for pi from 198.51.100.23 port 51900 ssh2'
  - name: one user many times does not fire
    source: auth
    alerts: 0
    lines:
      - 'Oct 18 02:00:00 web01 sshd[900]: Failed password for root from 198.51.100.23 port 51900 ssh2'
      - 'Oct 18 02:00:05 web01 sshd[900]: Failed password for root from 198.51.100.23 port 51900 ssh2'
      - 'Oct 18 02:00:10 web01 sshd[900]: Failed password for root from 198.51.100.23 port 51900 ssh2'
      - 'Oct 18 02:00:15 web01 sshd[900]: Failed password for root from 198.51.100.23 port 51900 ssh2'
      - 'Oct 18 02:00:20 web01 sshd[900]: Failed password for root from 198.51.100.23 port 51900 ssh2'
      - 'Oct 18 02:00:25 web01 sshd[900]: Failed password for root from 198.51.100.23 port 51900 ssh2'
  - name: two users do not fire
    source: auth
    alerts: 0
    lines:
      - 'Oct 18 02:00:00 web01 sshd[900]: Failed password for alice from 10.0.0.7 port 51900 ssh2'
      - 'Oct 18 02:01:00 web01 sshd[900]: Failed password for bob from 10.0.0.7 port 51900 ssh2'
