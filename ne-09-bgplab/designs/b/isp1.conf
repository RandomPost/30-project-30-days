hostname isp1
frr defaults traditional
service integrated-vtysh-config
!
interface lo
 ip address 10.255.1.1/32
!
interface eth1
 ip address 10.1.1.1/30
!
interface eth2
 ip address 10.99.0.1/24
!
ip route 198.51.100.0/24 blackhole
!
rpki
 rpki polling_period 30
 rpki retry_interval 10
 rpki cache 172.20.40.100 3323 preference 1
exit
!
bgp community-list standard RTBH permit 65535:666
!
! Addresses nobody may announce to us.
ip prefix-list BOGONS seq 5 permit 0.0.0.0/0
ip prefix-list BOGONS seq 10 permit 10.0.0.0/8 le 32
ip prefix-list BOGONS seq 15 permit 172.16.0.0/12 le 32
ip prefix-list BOGONS seq 20 permit 192.168.0.0/16 le 32
! What the customer owns: its /24, and /32s inside it only when tagged for blackholing.
ip prefix-list CUST-AGG seq 5 permit 203.0.113.0/24
ip prefix-list CUST-HOSTS seq 5 permit 203.0.113.0/24 ge 32 le 32
! What we announce to the exchange: customer aggregate and our own prefix.
ip prefix-list TO-IXP seq 5 permit 203.0.113.0/24
ip prefix-list TO-IXP seq 10 permit 198.51.100.0/24
!
! From the customer: blackhole /32s are accepted and discarded here, the /24 is
! accepted as the customer's best route, everything else (e.g. a leaked 10.66.0.0/16)
! is implicitly denied.
! 192.0.2.1 is a neighbour on rtbh0, a veth whose far end discards (see the lab file)
route-map CUST-IN permit 10
 match ip address prefix-list CUST-HOSTS
 match community RTBH
 set ip next-hop 192.0.2.1
 set local-preference 500
 set community no-export additive
route-map CUST-IN permit 20
 match ip address prefix-list CUST-AGG
 set local-preference 300
!
! To the customer: everything we have.
route-map CUST-OUT permit 10
!
! From the exchange route server: no bogons, no RPKI-invalid, valid routes preferred
! over routes with no ROA.
route-map RS-IN deny 5
 match ip address prefix-list BOGONS
route-map RS-IN deny 10
 match rpki invalid
route-map RS-IN permit 20
 match rpki valid
 set local-preference 150
route-map RS-IN permit 30
 match rpki notfound
 set local-preference 100
!
route-map RS-OUT permit 10
 match ip address prefix-list TO-IXP
!
router bgp 65001
 bgp router-id 10.255.1.1
 neighbor 10.1.1.2 remote-as 65100
 neighbor 10.1.1.2 description customer
 neighbor 10.1.1.2 timers 3 9
 neighbor 10.1.1.2 timers connect 5
 neighbor 10.99.0.254 remote-as 65500
 neighbor 10.99.0.254 description route-server
 neighbor 10.99.0.254 timers 3 9
 neighbor 10.99.0.254 timers connect 5
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 10.1.1.2 route-map CUST-IN in
  neighbor 10.1.1.2 route-map CUST-OUT out
  neighbor 10.99.0.254 route-map RS-IN in
  neighbor 10.99.0.254 route-map RS-OUT out
 exit-address-family
exit
!
end
