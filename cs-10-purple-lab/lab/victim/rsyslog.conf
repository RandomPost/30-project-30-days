# LAB ONLY: rsyslog for the victim. Traditional syslog lines, split into auth.log and syslog.
module(load="imuxsock")           # /dev/log, so logger/sshd/cron/crontab reach us
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat
$FileCreateMode 0644
$WorkDirectory /var/spool/rsyslog
auth,authpriv.*                    /logs/auth.log
*.*;auth,authpriv.none             /logs/syslog
