! hq-r1 (hq) - generated by netgen, do not edit by hand
frr defaults traditional
hostname hq-r1
service integrated-vtysh-config
!
interface lo
 ip address 10.255.1.1/32
 ip ospf area 0
exit
!
interface eth1
 description downlink to hq-sw1
 ip address 10.1.0.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 10.255.1.1
exit
!
end
