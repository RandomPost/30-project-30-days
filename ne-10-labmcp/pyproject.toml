[project]
name = "labmcp"
version = "0.1.0"
description = "Read-only MCP server exposing the BGP lab to Claude"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9,<2", "pytest"]

[project.scripts]
labmcp = "labmcp.server:main"

[tool.setuptools]
packages = ["labmcp"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lab: needs the NE-09 BGP lab running"]
