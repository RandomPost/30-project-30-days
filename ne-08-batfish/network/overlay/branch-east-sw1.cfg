! Policy that the source of truth cannot express yet: guest isolation.
! Guests may talk to their own subnet and to anything outside the 10/8 private
! space, but not to management loopbacks (10.255.0.0/16) or other internal VLANs.
ip access-list extended GUEST-IN
 permit ip 10.2.2.0 0.0.0.255 10.2.2.0 0.0.0.255
 deny ip 10.2.2.0 0.0.0.255 10.0.0.0 0.255.255.255
 permit ip any any
!
interface Vlan50
 ip access-group GUEST-IN in
!
