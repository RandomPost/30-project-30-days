# Intended config for the NE-04 lab routers, in the NE-05 netgen schema.
# Addresses must match ne-04-ospf-lab/configs.
sites:
- name: lab
  devices:
  - name: r1
    platform: frr
    role: router
    loopback: 10.255.0.1/32
    interfaces:
    - name: eth1
      ip: 10.0.12.1/30
      ospf_area: 0
      ospf_cost: 10
      ospf_hello: 1
      ospf_dead: 3
    - name: eth2
      ip: 10.0.13.1/30
      ospf_area: 0
      ospf_cost: 10
      ospf_hello: 1
      ospf_dead: 3
    - name: eth3
      ip: 192.168.1.1/24
      ospf_area: 0
      ospf_cost: 10
      ospf_passive: true
  - name: r2
    platform: frr
    role: router
    loopback: 10.255.0.2/32
    interfaces:
    - name: eth1
      ip: 10.0.12.2/30
      ospf_area: 0
      ospf_cost: 10
      ospf_hello: 1
      ospf_dead: 3
    - name: eth2
      ip: 10.0.23.1/30
      ospf_area: 0
      ospf_cost: 10
      ospf_hello: 1
      ospf_dead: 3
  - name: r3
    platform: frr
    role: router
    loopback: 10.255.0.3/32
    interfaces:
    - name: eth1
      ip: 10.0.23.2/30
      ospf_area: 0
      ospf_cost: 10
      ospf_hello: 1
      ospf_dead: 3
    - name: eth2
      ip: 10.0.13.2/30
      ospf_area: 0
      ospf_cost: 10
      ospf_hello: 1
      ospf_dead: 3
    - name: eth3
      ip: 192.168.3.1/24
      ospf_area: 0
      ospf_cost: 10
      ospf_passive: true
  links:
  - a: r1:eth1
    b: r2:eth1
  - a: r2:eth2
    b: r3:eth1
  - a: r1:eth2
    b: r3:eth2
