# docker compose up -d --build
# The port is published on loopback only. To expose the honeypot, change the mapping
# to "0.0.0.0:22:2222" ONLY on a dedicated host/VLAN with real sshd moved elsewhere,
# and block outbound traffic from the container (see README).
services:
  sshpot:
    build: .
    image: sshpot:latest
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:2222:2222"
    user: "10001:10001"
    read_only: true            # root filesystem is immutable
    cap_drop: [ALL]            # no capabilities (port 2222 needs none)
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    ulimits:
      nofile: 1024
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    volumes:
      - sshpot-data:/data      # the only writable path: JSONL log + host key
volumes:
  sshpot-data: {}
