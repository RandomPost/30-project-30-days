id: web-path-traversal
title: Path traversal attempt in web request
description: The decoded request path escapes the web root or names a system file.
severity: high
tags: [attack.initial_access, attack.t1190]
detection:
  selection:
    http_path|contains:
      - '../'
      - '..\'
      - '/etc/passwd'
      - '/etc/shadow'
      - 'win.ini'
  condition: selection
  threshold:
    group_by: src_ip
    count: 1
    window: 10m
tests:
  - name: encoded ../ fires
    source: nginx
    alerts: 1
    lines:
      - '192.0.2.140 - - [18/Oct/2026:10:00:00 +0000] "GET /download?file=%2e%2e%2f%2e%2e%2fetc%2fpasswd HTTP/1.1" 400 512 "-" "Mozilla/5.0 (X11; Linux x86_64)"'
  - name: double-encoded ../ fires
    source: nginx
    alerts: 1
    lines:
      - '192.0.2.141 - - [18/Oct/2026:10:05:00 +0000] "GET /download?file=%252e%252e%252fsecret HTTP/1.1" 404 512 "-" "Mozilla/5.0 (X11; Linux x86_64)"'
  - name: normal static file does not fire
    source: nginx
    alerts: 0
    lines:
      - '10.0.0.7 - - [18/Oct/2026:10:10:00 +0000] "GET /static/app.css HTTP/1.1" 200 512 "-" "Mozilla/5.0 (X11; Linux x86_64)"'
