hostname rs
frr defaults traditional
service integrated-vtysh-config
!
interface eth1
 ip address 10.99.0.254/24
!
rpki
 rpki polling_period 30
 rpki retry_interval 10
 rpki cache 172.20.40.100 3323 preference 1
exit
!
ip prefix-list BOGONS seq 5 permit 0.0.0.0/0
ip prefix-list BOGONS seq 10 permit 10.0.0.0/8 le 32
ip prefix-list BOGONS seq 15 permit 172.16.0.0/12 le 32
ip prefix-list BOGONS seq 20 permit 192.168.0.0/16 le 32
!
! The route server validates every client route against RPKI before anyone sees it.
route-map CLIENT-IN deny 5
 match ip address prefix-list BOGONS
route-map CLIENT-IN deny 10
 match rpki invalid
route-map CLIENT-IN permit 20
!
route-map CLIENT-OUT permit 10
!
router bgp 65500
 bgp router-id 10.255.5.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor CLIENTS peer-group
 neighbor CLIENTS timers 3 9
 neighbor CLIENTS timers connect 5
 neighbor 10.99.0.1 remote-as 65001
 neighbor 10.99.0.1 peer-group CLIENTS
 neighbor 10.99.0.2 remote-as 65002
 neighbor 10.99.0.2 peer-group CLIENTS
 neighbor 10.99.0.10 remote-as 65300
 neighbor 10.99.0.10 peer-group CLIENTS
 neighbor 10.99.0.66 remote-as 65666
 neighbor 10.99.0.66 peer-group CLIENTS
 !
 address-family ipv4 unicast
  neighbor CLIENTS activate
  neighbor CLIENTS route-server-client
  neighbor CLIENTS route-map CLIENT-IN in
  neighbor CLIENTS route-map CLIENT-OUT out
 exit-address-family
exit
!
end
