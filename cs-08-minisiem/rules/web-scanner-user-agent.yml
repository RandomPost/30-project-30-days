id: web-scanner-user-agent
title: Known scanner or attack tool user agent
description: The User-Agent identifies a vulnerability scanner or fuzzer.
severity: medium
tags: [attack.reconnaissance, attack.t1595.002]
falsepositives: [Your own authorised security scans]
detection:
  selection:
    user_agent|contains:
      - sqlmap
      - nikto
      - nmap
      - masscan
      - dirbuster
      - gobuster
      - wfuzz
      - nuclei
      - acunetix
  condition: selection
  threshold:
    group_by: src_ip
    count: 1
    window: 1h
tests:
  - name: sqlmap user agent fires
    source: nginx
    alerts: 1
    lines:
      - '198.51.100.77 - - [18/Oct/2026:11:00:00 +0000] "GET / HTTP/1.1" 200 512 "-" "sqlmap/1.7.2#stable (https://sqlmap.org)"'
  - name: browser user agent does not fire
    source: nginx
    alerts: 0
    lines:
      - '10.0.0.7 - - [18/Oct/2026:11:00:00 +0000] "GET / HTTP/1.1" 200 512 "-" "Mozilla/5.0 (X11; Linux x86_64)"'
